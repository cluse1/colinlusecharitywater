<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charity: Water</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero-section">
    <div class="overlay">
      <div class="hero-text">
        <h1>CHARITY: WATER</h1>
        <p>SAVING THE PLANET<br />DROP AT A TIME</p>
        <a href="#donate" class="cta-button">Donate Now</a>
      </div>
    </div>
  </header>

  <section class="testimonial-section">
    <h2>What People Are Saying</h2>
    <div class="testimonial">
      <p>“Thanks to Charity: Water, my village has access to clean water for the first time in decades.”</p>
      <span>— Amina, Ethiopia</span>
    </div>
  </section>

  <section class="signup-section">
    <h2>Join the Mission</h2>
    <p>Be the first to hear updates and stories from the field.</p>
    <form>
      <input type="email" placeholder="Enter your email" required>
      <button type="submit">Subscribe</button>
    </form>
  </section>
</body>
</html>
